name: Build APK
on:
  push: {branches: [main]}
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npm run build
        env: {PUSH_ENABLED: "${{ secrets.GOOGLE_SERVICES_JSON != '' }}"}
      - run: npx cap add android
      - name: google-services.json (للإشعارات)
        env: {GS: "${{ secrets.GOOGLE_SERVICES_JSON }}"}
        run: echo "$GS" | base64 -d > android/app/google-services.json
      - run: node scripts/patch-android.js
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: hasabat-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
